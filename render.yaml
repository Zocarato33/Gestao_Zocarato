services:
  - type: web
    name: gestao-demandas
    runtime: docker
    plan: free
    healthCheckPath: /api/auth/status
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: APP_TZ
        value: America/Sao_Paulo
      - key: SESSAO_HORAS
        value: "12"
